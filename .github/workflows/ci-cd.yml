name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openhealthmcp-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/xaxee/open-health-mcp

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/OpenHealthMCP.Tests/OpenHealthMCP.Tests.csproj

      - name: Build
        run: dotnet build OpenHealthMCP.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/OpenHealthMCP.Tests/OpenHealthMCP.Tests.csproj --configuration Release --no-restore

      - name: Validate production Compose
        run: >-
          docker compose
          --env-file deploy/.env.example
          --file deploy/compose.production.yml
          config --quiet

      - name: Validate shell scripts
        run: >-
          docker run --rm
          --volume "${PWD}:/workspace:ro"
          koalaman/shellcheck:stable
          /workspace/deploy/deploy.sh
          /workspace/tests/oauth-flow.sh

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          --volume "${PWD}/deploy/Caddyfile.health:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Run OAuth integration flow
        shell: bash
        env:
          BASE_URL: http://localhost:18080
          OAUTH_RESOURCE: https://health.hubertiwan.pl/mcp
          OAUTH_OWNER_PASSWORD: test-only-owner-password-never-use-in-production
          MCP_AUTH_TOKEN: test-only-static-token-never-use-in-production
        run: |
          trap 'docker compose --file tests/compose.oauth.yml down --volumes --remove-orphans' EXIT
          docker compose --file tests/compose.oauth.yml up --detach --build
          if ! bash tests/oauth-flow.sh; then
            docker compose --file tests/compose.oauth.yml logs --no-color --tail 200
            exit 1
          fi

      - name: Validate Docker image build
        run: docker build --tag openhealthmcp-ci:${{ github.sha }} .

  publish:
    name: Publish immutable image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image reference
        id: image
        shell: bash
        run: echo "reference=${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.reference }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://health.hubertiwan.pl/health
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment files
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            'install -d -m 700 /home/nexus-deploy/openhealthmcp'
          scp -P "${VPS_PORT}" \
            deploy/compose.production.yml deploy/deploy.sh \
            "${VPS_USER}@${VPS_HOST}:/home/nexus-deploy/openhealthmcp/"

      - name: Deploy immutable image
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "chmod 700 /home/nexus-deploy/openhealthmcp/deploy.sh && /home/nexus-deploy/openhealthmcp/deploy.sh '${IMAGE}'"

      - name: Verify public HTTPS endpoint
        shell: bash
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent --show-error \
              --max-time 10 https://health.hubertiwan.pl/health \
              | grep --quiet '"status":"healthy"'; then
              echo "Public HTTPS health check passed."
              exit 0
            fi

            echo "Public health check ${attempt}/15 failed; retrying..."
            sleep 4
          done

          echo "Public HTTPS health check failed." >&2
          exit 1